name: Vérifier le portfolio FR / EN
on:
  push:
    branches:
      - feature/portfolio-v2-1-fr-en
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund
      - name: Vérifier les contenus FR / EN
        run: npm run test:content
      - name: Vérifier les types et construire le site
        run: npm run build
