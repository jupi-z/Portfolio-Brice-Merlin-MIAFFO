v><\/div><\/div><\/section><section class=\"quote-vision\"><span>SA VISION<\/span><h2>« Décomplexer la prochaine génération des leaders Africain de façon à restaurer la crédibilité de l&#x27;entreprise congolaise ».<\/h2><p>Vision transmise pour le site M-Y-M Advisor · formulation conservée telle que fournie.<\/p><\/section>", "fr/expertises": "<section class=\"inner-hero inner-hero-plain\"><span class=\"micro-title\">DOMAINES D&#x27;INTERVENTION<\/span><h1>Penser juste.<br/><em>Agir avec méthode.<\/em><\/h1><p>De la préparation d&#x27;un dossier de crédit au pilotage de la transformation, une expertise forgée par les responsabilités opérationnelles et de direction.<\/p><\/section><section class=\"section-pad expertise-detail\"><div class=\"section-index\">01—04 / DOMAINES<\/div><div id=\"expertiseDetailList\"><\/div><\/section><section class=\"dark-promo\"><span class=\"micro-title\">UNE MÉTHODE PRAGMATIQUE<\/span><h2>Écouter. Analyser.<br/><em>Structurer. Accompagner.<\/em><\/h2><p>Chaque accompagnement commence par la compréhension du contexte et la clarification des objectifs.<\/p><a class=\"btn btn-accent\" href=\"#/fr/contact\">Décrire votre besoin <span class=\"button-circle\">&nearrow;<\/span><\/a><\/section>", "fr/formations": "<section class=\"inner-hero inner-hero-plain\"><span class=\"micro-title\">EXECUTIVE EDUCATION / 2026—2027<\/span><h1>Transmettre le savoir.<br/><em>Développer le pouvoir d&#x27;agir.<\/em><\/h1><p>Une sélection des 12 formations que le catalogue de M-Y-M Advisor et SPE-Fin Québec attribue explicitement à Brice Merlin Miaffo.<\/p><div class=\"training-meta\"><span><b>12<\/b> FORMATIONS PERSONNELLES<\/span><span>PRÉSENTIEL / INTRA-ENTREPRISE<\/span><span>FRANÇAIS · ANGLAIS SUR DEMANDE<\/span><\/div><\/section><section class=\"section-pad training-catalogue\"><div class=\"catalogue-toolbar\"><div class=\"section-index\">CATALOGUE / LES PROGRAMMES<\/div><div class=\"catalogue-controls\"><label class=\"filter-search\"><svg class=\"icon\"  class=\"intro-bottom\"><p>My experience connects banking realities, lenders’ requirements and entrepreneurs’ ambitions. This dual perspective allows me to approach each project with structure and pragmatism.<\/p><a aria-label=\"D&eacute;couvrir mon parcours\" class=\"circle-link\" href=\"#/en/parcours\"><span>Discover<br/>my journey<\/span><span class=\"circle-arrow\">&nearrow;<\/span><\/a><\/div><\/div>\n<\/section>\n<section class=\"numbers-section\"><div class=\"number-lead\"><span class=\"micro-title\">ONE CAREER, MULTIPLE PERSPECTIVES<\/span><p>From risk analysis<br/>to banking leadership.<\/p><\/div><div class=\"number-stats\"><div><b>20<span>years<\/span><\/b><small>Experience reported in the professional catalogue<\/small><\/div><div><b>02<\/b><small>Main countries of banking experience: Cameroon and DR Congo<\/small><\/div><div><b>12<\/b><small>Training programmes attributed to me in the 2026–2027 catalogue<\/small><\/div><\/div><\/section>\n<section aria-labelledby=\"expertiseTitle\" class=\"expertise-home section-pad\"><div class=\"section-heading\"><div class=\"section-index\"><span>02 / AREAS OF EXPERTISE<\/span><\/div><div class=\"section-heading-main\"><h2 id=\"expertiseTitle\">My expertise,<br/><em>your challenges.<\/em><\/h2><a class=\"text-link\" href=\"#/en/expertises\">Explore all areas of expertise <span>&nearrow;<\/span><\/a><\/div><\/div><div class=\"expertise-layout\"><div class=\"expertise-list\" id=\"expertiseList\"><\/div><div class=\"expertise-visual\" id=\"expertiseVisual\"><div class=\"visual-top\"><span>POSITIONING / 01—04<\/span><span>BM.©<\/span><\/div><div aria-hidden=\"true\" class=\"visual-orbit\"><span class=\"orbit-one\"><\/span><span class=\"orbit-two\"><\/span><span class=\"orbit-core\">B<span>&middot;<\/span>M<\/span><\/div><div class=\"visual-bottom\"><span>ADVISORY, STRUCTURING<br/>&amp; TRANSFORMATION<\/span><span>&nearrow;<\/span><\/div><\/div><\/div><\/section>\n<section class=\"statement\"><div class=\"statement-top\"><span>A CONVICTION THAT GUIDES MY WORK<\/span><span>&nearrow;<\/span><\/div><blockquote>“Bridging the ambitions of businesses, the expectations of lenders and appropriate financial solutions.”<\/blockquote><div class=\"statement-foot\"><span>A FINANCIAL AND HUMAN-CENTRED APPROACH.<\/span><span>— BRICE MIAFFO<\/span><\/div><\/section>\n<section class=\"formation-home section-pad\"><div class=\"section-heading\"><div class=\"section-index\"><span>03 / SHARING KNOWLEDGE<\/span><\/div><div class=\"section-heading-main\"><h2>Knowledge<br/>as a <em>driver of action.<\/em><\/h2><a class=\"text-link\" href=\"#/en/formations\">Explore all programmes <span>&nearrow;<\/span><\/a><\/div><\/div><div class=\"featured-training\" id=\"featuredTraining\"><\/div><\/section>\n<section class=\"portrait-cta\"><div class=\"portrait-cta-copy\"><span class=\"micro-title\">THE NEXT STEP STARTS WITH A CONVERSATION<\/span><h2>Let us discuss<br/><em>what matters to you.<\/em><\/h2><p>A financing need, an organisational challenge, a team to train or a conference to prepare?<\/p><a class=\"btn btn-accent btn-large\" href=\"#/en/contact\">Get in touch <span class=\"button-circle\">&nearrow;<\/span><\/a><\/div><div aria-hidden=\"true\" class=\"portrait-cta-detail\">BM<span>✳<\/span><\/div><\/section>\n", "en/parcours": "<section class=\"inner-hero inner-hero-profile\"><div><span class=\"micro-title\">BRICE MERLIN MIAFFO / PROFESSIONAL BIOGRAPHY<\/span><h1>A career.<br/><em>A perspective.<\/em><\/h1><p>From auditing to advisory, from credit operations to management responsibilities, a career shaped by decisions that affect the future of organisations.<\/p><\/div><div class=\"profile-image\"><img alt=\"Portrait de Brice Miaffo\" height=\"1402\" loading=\"lazy\" src=\"data:image/webp;base64,UklGRoi0AQBXRUJQVlA4IHy0AQBQGgqdASpiBHoFPi0WiUOhoSOmI7Pp+MAFiWduKZjntQoJLIO2AS1NpfznDBw/1DdpbA/uXI+z54a/4vha+veoH/Pf7t6fv+33uCA/llZrlF3/z+nf+zc+HlX3fHr2E3wmY/+6/u/yZ/wn7XfRNyT5w/KvEH+S/73+r+3P/f5O+8f+nzgOj/9L/if9J let selected='01';
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parse(){let parts=location.hash.slice(2).split('/').filter(Boolean);return {lang:parts[0]==='en'?'en':'fr',page:['parcours','expertises','formations','perspectives','contact'].includes(parts[1])?parts[1]:'home'};}
function trainingRow(t,lang,featured){return `<button type="button" class="${featured?'featured-item':'training-item'}" data-training="${t.id}" aria-label="${labels[lang].details} ${escapeHtml(t.title)}"><span class="training-n">${t.n}</span><span class="training-name">${escapeHtml(t.title)}</span><span class="training-cat">${escapeHtml(t.cat)}</span>${featured?'':`<span class="training-duration">${escapeHtml(t.duration)}</span>`}<span class="training-go">↗</span></button>`;}
function expertiseRow(e,active){return `<button class="expertise-row ${active?'active':''}" data-expertise="${e.num}" aria-expanded="${active?'true':'false'}" type="button"><span class="ex-num">${e.num}</span><div><h3>${escapeHtml(e.title)}</h3><p>${escapeHtml(e.desc)}</p></div><span class="ex-arrow">${active?'−':'↗'}</span></button>`;}
function renderRows(lang){
 const db=catalogues[lang];
 let featured=document.getElementById('featuredTraining');if(featured)featured.innerHTML=[db.training[0],db.training[1],db.training[10],db.training[11]].map(t=>trainingRow(t,lang,true)).join('');
 let ex=document.getElementById('expertiseList');if(ex)ex.innerHTML=db.expertise.map(e=>expertiseRow(e,e.num===selected)).join('');
 let detail=document.getElementById('expertiseDetailList');if(detail)detail.innerHTML=db.expertise.map(e=>`<article class="expertise-row" style="cursor:default"><span class="ex-num">${e.num}</span><div><h3>${escapeHtml(e.title)}</h3><p>${escapeHtml(e.desc)}</p><p>${escapeHtml(e.detail)}</p></div><span class="ex-arrow">↗</span></article>`).join('');
 let visual=document.getElementById('expertiseVisual');if(visual){const title=db.expertise.find(e=>e.num===selected)?.title||'';let first=visual.querySelector('.visual-top span:first-child');if(first)first.textContent=`${lang==='fr'?'POSITIONNEMENT':'POSITIONING'} / ${selected}—04`;let name=visual.querySelector('.visual-bottom span:first-child');if(name)name.textContent=title.toUpperCase();}
 renderTrainings(lang);
}
function renderTrainings(lang){
 const list=document.getElementById('trainingResults');if(!list)return;
 const q=(document.getElementById('trainingSearch')?.value||'').trim().toLowerCase();
 const cat=document.getElementById('trainingFilter')?.value||'all';
 const data=catalogues[lang].training.filter(t=>(cat==='all'||t.category===cat)&&(!q||[t.title,t.cat,t.summary,t.audience].join(' ').toLowerCase().includes(q)));
 list.innerHTML=data.length?data.map(t=>trainingRow(t,lang,false)).join(''):`<div class="training-zero">${labels[lang].empty}<br>${labels[lang].modify}</div>`;
}
function showTraining(id,lang){
 const t=catalogues[lang].training.find(t=>t.id===id);if(!t)return;
 let d=document.getElementById('trainingDialog');
 document.getElementById('dialogContent').innerHTML=`<div class="micro-title">MASTERCLASS / ${t.n} · ${escapeHtml(t.cat.toUpperCase())}</div><h2 id="modalTitle">${escapeHtml(t.title)}</h2><p>${escapeHtml(t.summary)}</p><div class="modal-info"><span>◷ ${escapeHtml(t.duration)}</span><span>${labels[lang].mode}</span></div><p><b>${labels[lang].audience}</b><br>${escapeHtml(t.audience)}</p><p><b>${labels[lang].syllabus}</b></p><ul class="modal-syllabus">${t.themes.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul><a href="mailto:mym@mymadvisor.ca?subject=${encodeURIComponent('Brice Miaffo - '+t.title)}" class="btn btn-primary btn-large modal-cta">${labels[lang].ask} ↗</a>`;
 if(d.showModal)d.showModal();else d.setAttribute('open','');
}
function render(){
 const {lang,page}=parse();document.documentElement.lang=lang;
 document.title=(lang==='fr'?'Brice Miaffo — Portfolio Premium':'Brice Miaffo — Premium Portfolio');
 root.innerHTML=`<a href="#main" class="skip-link">${lang==='fr'?'Aller au contenu':'Skip to content'}</a><div class="page-wrap">${templates[lang+'/header']}${templates[lang+'/mobile-nav']}<main id="main"><div class="page-view" data-page="${page}">${templates[lang+'/'+page]}</div></main>${templates[lang+'/footer']}</div><dialog id="trainingDialog" class="modal" aria-labelledby="modalTitle"><div class="modal-box training-modal"><button class="modal-close btn btn-ghost" id="closeDialog" type="button">×</button><div id="dialogContent"></div></div></dialog>`;
 document.querySelectorAll('[data-nav]').forEach(a=>{let active=a.dataset.nav===page;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');});
 document.querySelectorAll('[data-language]').forEach(b=>{b.classList.toggle('active',b.dataset.language===lang);b.setAttribute('aria-pressed',String(b.dataset.language===lang));});
 const menu=document.getElementById('mobileNav');menu.hidden=true;
 document.getElementById('year').textContent=new Date().getFullYear();
 const n=document.querySelector('.form-note');if(n&&page==='contact')n.textContent=labels[lang].note;
 let send=document.querySelector('#contactForm button[type="submit"]');if(send)send.innerHTML=labels[lang].button+' <span class="button-circle">↗</span>';
 renderRows(lang);
 window.scrollTo({top:0,behavior:'instant'});
}
root.addEventListener('click',e=>{
 const target=e.target instanceof Element?e.target:null;if(!target)return;
 let b=target.closest('[data-language]');if(b){const {page}=parse();location.hash='#/'+b.dataset.language+(page==='home'?'':'/'+page);return;}
 if(target.closest('#themeToggle')){const dark=document.documentElement.dataset.mode==='dark';let v=dark?'light':'dark';document.documentElement.dataset.mode=v;document.documentElement.dataset.theme=v;try{localStorage.setItem('bm:theme',v)}catch{}return;}
 if(target.closest('#menuToggle')){let menu=document.getElementById('mobileNav');menu.hidden=!menu.hidden;return;}
 b=target.closest('[data-training]');if(b){showTraining(Number(b.dataset.training),parse().lang);return;}
 b=target.closest('[data-expertise]');if(b){selected=b.dataset.expertise;renderRows(parse().lang);return;}
 if(target.closest('#closeDialog')){document.getElementById('trainingDialog').close();return;}
 if(target.id==='trainingDialog'){target.close();return;}
});
root.addEventListener('input',e=>{if(e.target.id==='trainingSearch')renderTrainings(parse().lang);});
root.addEventListener('change',e=>{if(e.target.id==='trainingFilter')renderTrainings(parse().lang);});
root.addEventListener('submit',e=>{
 if(e.target.id!=='contactForm')return;e.preventDefault();
 if(!e.target.reportValidity())return;
 const fd=new FormData(e.target),subject=String(fd.get('subject')),name=String(fd.get('name')),email=String(fd.get('email')),message=String(fd.get('message'));
 window.location.href=`mailto:mym@mymadvisor.ca?subject=${encodeURIComponent('[Portfolio] '+subject)}&body=${encodeURIComponent(message+'\n\n'+name+'\n'+email)}`;
});
window.addEventListener('hashchange',render);
try{let t=localStorage.getItem('bm:theme')||'light';document.documentElement.dataset.mode=t;document.documentElement.dataset.theme=t;}catch{}
if(!location.hash.startsWith('#/'))location.hash='#/fr';else render();
</script></body></html>
